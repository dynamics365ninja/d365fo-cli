name: release

# Publishes a GitHub release for a v<major>.<minor>.<patch> tag. See docs/RELEASING.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  verify:
    # Windows, because the bridge targets .NET Framework 4.8.
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The tag has to name the version the tagged source reports, or the release would
      # carry binaries that identify themselves as something else.
      - name: Check the tag against Directory.Build.props
        id: version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/D365FO.Cli/D365FO.Cli.csproj -getProperty:Version).Trim()
          if ("v$version" -cne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match the source version $version. Set VersionPrefix/VersionSuffix in Directory.Build.props (docs/RELEASING.md)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Fails here, before anything is built, when the CHANGELOG has no section for it.
      - name: Extract release notes
        shell: pwsh
        run: ./scripts/get-release-notes.ps1 -Version ${{ steps.version.outputs.version }} | Out-File -Encoding utf8 release-notes.md

      - name: Test
        run: dotnet test d365fo-cli.slnx -c Release -nologo

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # Each platform is published on its own runner, so the executable bit and the macOS
  # code signature are the ones the platform itself produces.
  publish:
    needs: verify
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The same script the ci workflow packs and installs, so what is released was tried.
      - name: Publish the release layout
        shell: bash
        run: bash scripts/publish-release-layout.sh "$RID" publish

      # Only where the runner can execute what it built (the macOS runner is arm64).
      - name: Check the published version
        if: matrix.rid != 'osx-x64'
        shell: bash
        run: |
          reported="$(./publish/bin/d365fo --version | tr -d '\r')"
          case "$reported" in
            "$VERSION"|"$VERSION+"*) echo "$reported" ;;
            *) echo "Published CLI reports '$reported', expected $VERSION." >&2; exit 1 ;;
          esac

      - name: Archive (zip)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "dist/d365fo-cli-$env:VERSION-$env:RID.zip"

      - name: Archive (tar.gz)
        if: matrix.rid != 'win-x64'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/d365fo-cli-$VERSION-$RID.tar.gz" -C publish .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*

  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"

  # The npm packages are made from the archives of this release, after it exists. They are
  # always attached to the run as `npm-packages`; publishing needs the repository variable
  # NPM_PUBLISH=true, because it works only once each package has a trusted publisher on
  # npmjs.com naming this workflow file. See docs/RELEASING.md.
  npm:
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token npm trusted publishing exchanges; there is no NPM_TOKEN
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # From the archives, not the dist-* folders of the publish jobs: tar keeps the
      # executable bit, which an Actions artifact does not.
      - name: Unpack the release archives
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            mkdir -p "layout/$rid"
            if [ "$rid" = "win-x64" ]; then
              unzip -q "dist/d365fo-cli-$VERSION-$rid.zip" -d "layout/$rid"
            else
              tar -xzf "dist/d365fo-cli-$VERSION-$rid.tar.gz" -C "layout/$rid"
            fi
          done

      - name: Pack the npm packages
        run: |
          node scripts/build-npm-packages.mjs --version "$VERSION" --out npm-out --pack \
            win-x64=layout/win-x64 linux-x64=layout/linux-x64 \
            osx-x64=layout/osx-x64 osx-arm64=layout/osx-arm64

      - name: Install and check the Linux package
        run: node scripts/smoke-npm-package.mjs --version "$VERSION" --tarballs npm-out/tarballs

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-out/tarballs/*.tgz

      # The platform packages first: the launcher must never name versions that do not exist.
      # A version already in the registry is skipped, so a failed run can be re-run. npm names
      # the tarball of @dynamics365ninja/<name> dynamics365ninja-<name>-<version>.tgz.
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          for name in d365fo-cli-win32-x64 d365fo-cli-linux-x64 d365fo-cli-darwin-x64 d365fo-cli-darwin-arm64 d365fo-cli; do
            if [ "$(npm view "@dynamics365ninja/$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "@dynamics365ninja/$name@$VERSION is already published."
            else
              npm publish "./npm-out/tarballs/dynamics365ninja-$name-$VERSION.tgz" --access public --tag "$tag"
            fi
          done
