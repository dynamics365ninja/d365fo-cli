name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore d365fo-cli.slnx

      - name: Build
        run: dotnet build d365fo-cli.slnx --no-restore -c Release -nologo

      # No LogFileName: both test assemblies run concurrently and a fixed name makes the
      # second one overwrite the first. That is not cosmetic — when the run went red the
      # surviving .trx was the assembly that PASSED, so the failing test was unnamed in the
      # artifact and only visible in the console scrollback. The default name carries the
      # assembly and a timestamp, so each writes its own.
      - name: Test
        run: dotnet test d365fo-cli.slnx --no-build -c Release --logger "trx" --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/**"

  # A hundred-odd warnings hide the one that matters — NU1903 (a known-vulnerable transitive
  # SQLite package) sat in the build output unnoticed. This ratchets the count: it may fall
  # freely, and any rise fails with the new warnings named. Ubuntu only; the count is the same
  # on every OS and there is no reason to pay for it three times.
  warning-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Warning count must not rise
        shell: pwsh
        run: ./scripts/check-build-warnings.ps1 -Baseline 114

  # What `dotnet test` builds is not what anybody installs. install.ps1/install.sh publish
  # self-contained, single-file and TRIMMED, and issue #182 showed that shape failing on
  # every SQLite query, on the native SQLite load, and - worst - returning an empty journal
  # instead of an error, all while the suite above stayed green. So publish the installed
  # shape here and diff it against an ordinary build: see scripts/smoke-published-cli.ps1.
  published-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Published build must match an ordinary build
        shell: pwsh
        run: ./scripts/smoke-published-cli.ps1 -Rid ${{ matrix.rid }}

  # The knowledge corpus is gated the same fail-closed way generated code is: every named
  # AOT type/API must be covered by the snapshot captured against a real standard index, and
  # every X++/XML example must pass the offline BP validator. CI has no index, so this is the
  # snapshot half — `d365fo knowledge audit --capture` re-captures it on a machine that has one.
  knowledge-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Audit the knowledge corpus
        run: dotnet run --project src/D365FO.Cli -c Release -- knowledge audit --verify --output json

  # The eval catalog is the regression gate for the two competencies the repo claims:
  # every case replays its canonical_args through a real `d365fo` child process and diffs
  # the result against a reviewed golden, so a scaffolder change that alters output lands
  # here rather than on a customer's AOS. Replay is agent-free and offline (temp SQLite
  # index + temp output dir), which is what makes it CI-safe.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Replay the eval catalog
        run: dotnet run --project src/D365FO.Cli -c Release -- eval run --all --output json
      - name: Check the K/E/T coverage report
        run: dotnet run --project src/D365FO.Cli -c Release --no-build -- eval coverage --check --output json
      # The oracle's bar without an installation: every rule over the checked-in fixtures,
      # zero errors. It cannot catch what a sweep of a real PackagesLocalDirectory catches
      # — that needs 242 858 shipped files and a VM — but it does catch a rule that starts
      # firing on the corpus's own reference material, which is the same failure in
      # miniature and the reason the fixtures are XML the tool itself would accept.
      - name: Sweep the fixtures with every rule
        run: dotnet run --project src/D365FO.Cli -c Release --no-build -- oracle sweep --dry --output json

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Frontmatter quoting round-trip
        run: python3 scripts/test-emit-skills.py
      - name: Emit skills (Copilot + Anthropic + d365fo-cli)
        run: python3 scripts/emit-skills.py
      - name: Fail on untracked drift
        run: |
          # SKILL.md is included: its rule-canon and reference-table regions are
          # generated from skills/_source, so an edited topic that was not re-emitted
          # shows up here rather than as a quietly stale rule shipped to agents.
          if [ -n "$(git status --porcelain skills/copilot skills/anthropic skills/d365fo-cli)" ]; then
            echo "::error::skills/ artifacts drift from skills/_source. Run scripts/emit-skills.py locally and commit."
            git status --porcelain skills/
            exit 1
          fi
      - name: Fail on unparseable frontmatter
        # Drift only proves the bytes match what the emitter produced — #172 shipped
        # frontmatter no YAML parser could read and this job stayed green. Parse it.
        run: python3 scripts/check-skill-frontmatter.py

  # docs/MCP_TOOLS.md maps the adapter's tools onto the commands behind them, and is
  # generated from both surfaces rather than kept by hand. The generator refuses to
  # write a mapping where one side names something the other does not have, so this
  # job is a parity gate as much as a docs gate.
  mcp-tool-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build the CLI and the adapter
        run: dotnet build src/D365FO.Cli src/D365FO.Mcp -c Release -nologo
      - name: docs/MCP_TOOLS.md must be current
        run: python3 scripts/emit-mcp-tools.py --check
